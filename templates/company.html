{% extends 'base.html' %}{% set heading='Empresa' %}{% set subtitle='Dados que aparecem nos documentos' %}{% block content %}<section class="card pad" style="max-width:850px"><div class="doc-head" style="margin-bottom:20px"><img src="{{url_for('static',filename='logo-jvs.png')}}"><div class="doc-title"><h1>{{c.name}}</h1><p>{{c.phone}} • {{c.instagram}}</p></div></div><form method="post" class="form-grid"><div class="field full"><label>Nome da oficina</label><input class="input" name="name" value="{{c.name}}"></div><div class="field"><label>Telefone</label><input class="input" name="phone" value="{{c.phone}}"></div><div class="field"><label>Instagram</label><input class="input" name="instagram" value="{{c.instagram}}"></div><div class="field full"><label>Endereço</label><input class="input" name="address" value="{{c.address}}"></div><div class="field full"><label>Chave PIX</label><input class="input" name="pix_key" value="{{c.pix_key}}"></div><div class="full"><button class="btn btn-primary">Salvar dados</button></div></form></section>{% endblock %}
