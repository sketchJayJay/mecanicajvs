{% extends 'base.html' %}{% set heading='Editar estoque' %}{% set subtitle=item.name %}{% block content %}<section class="card pad" style="max-width:820px"><form method="post" class="form-grid"><div class="field"><label>Código</label><input class="input" name="code" value="{{item.code}}"></div><div class="field"><label>Unidade</label><input class="input" name="unit" value="{{item.unit}}"></div><div class="field full"><label>Descrição</label><input class="input" name="name" value="{{item.name}}" required></div><div class="field"><label>Quantidade</label><input class="input" type="number" step="0.001" name="qty" value="{{item.qty}}"></div><div class="field"><label>Estoque mínimo</label><input class="input" type="number" step="0.001" name="min_qty" value="{{item.min_qty}}"></div><div class="field"><label>Custo</label><input class="input" type="number" step="0.01" name="cost" value="{{item.cost}}"></div><div class="field"><label>Preço de venda</label><input class="input" type="number" step="0.01" name="price" value="{{item.price}}"></div><div class="full toolbar"><button class="btn btn-primary">Salvar</button><a class="btn btn-ghost" href="{{url_for('inventory')}}">Voltar</a></div></form></section>{% endblock %}
