<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar • JVS Mecânica</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="login-page"><form class="login-box" method="post"><img class="login-logo" src="{{ url_for('static', filename='logo-jvs.png') }}"><h1>JVS Mecânica</h1><p>Acesse o sistema da oficina</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{category}}">{{message}}</div>{% endfor %}{% endwith %}<div class="field"><label>E-mail</label><input class="input" type="email" name="email" required autofocus></div><div class="field"><label>Senha</label><input class="input" type="password" name="password" required></div><button class="btn btn-primary" style="width:100%;margin-top:8px">Entrar</button></form></body></html>
