{% extends 'base.html' %}{% set heading='Editar cliente' %}{% set subtitle=c.name %}{% block content %}<section class="card pad" style="max-width:820px"><form method="post" class="form-grid"><div class="field full"><label>Nome *</label><input class="input" name="name" value="{{c.name}}" required></div><div class="field"><label>Telefone</label><input class="input" name="phone" value="{{c.phone}}"></div><div class="field"><label>CPF/CNPJ</label><input class="input" name="cpf_cnpj" value="{{c.cpf_cnpj}}"></div><div class="field full"><label>E-mail</label><input class="input" name="email" value="{{c.email}}"></div><div class="field full"><label>Endereço</label><input class="input" name="address" value="{{c.address}}"></div><div class="field full"><label>Observações</label><textarea class="textarea" name="notes">{{c.notes}}</textarea></div><div class="full toolbar"><button class="btn btn-primary">Salvar</button><a class="btn btn-ghost" href="{{url_for('clients')}}">Voltar</a></div></form></section>{% endblock %}
